source:
  get:
    operationId: sourceDetails
    tags:
      - Source
    summary: Get source content
    description: |
      Get a content **source** from an organization.
      
      **Important:** For files, the `path` parameter must include the file extension (e.g., `myfile.html`, `data.json`).
      The full URL would be: `/source/{org}/{repo}/myfile.html`
    parameters:
      - $ref: "./parameters.yaml#/orgParam"
      - $ref: "./parameters.yaml#/repoParam"
      - $ref: "./parameters.yaml#/pathParam"
    responses:
      '200':
        $ref: "./responses.yaml#/source/200"
      '400':
        $ref: "./responses.yaml#/400"
      '401':
        $ref: "./responses.yaml#/401"
      '404':
        $ref: "./responses.yaml#/404"
      '500':
        $ref: "./responses.yaml#/500"
  put:
    operationId: putSource
    tags:
      - Source
    summary: Create or replace source content
    description: |
      Create or replace a content **source** within an organization.

      Accepts either a `multipart/form-data` body with the content in the `data` field, or a
      raw request body for text-based types (`text/html`, `application/json`).

      The `multipart/form-data` body may also include an optional `guid` field. When the target
      location does not already have a stored identifier, `guid` becomes the document identifier.
      It must be a UUID. A `guid` that is not a UUID is rejected with a 400 response. When the
      target already has a stored identifier that differs from `guid`, the request is rejected with
      a 409 response. When omitted, the service generates a UUID.

      HTML (`.html` or `text/html`) and SVG (`.svg` or `image/svg+xml`) content is sanitised before it
      is stored. Markup outside the DA document format (scripts, event handlers, styles, unsafe URLs,
      unknown elements and attributes) is removed silently. HTML is normalised to the DA structure
      (`header`, `main` with section `div`s, `footer`, optional `da-metadata`), and content that is
      already clean is stored byte for byte. A file extension that does not match the content type
      is rejected with a 415 response; HTML over 10 MB or SVG over 5 MB is rejected with a 413 response.

      **Important:** For files, the `path` parameter must include the file extension (e.g., `myfile.html`, `data.json`).
      For folders, omit the extension (e.g., `myfolder`).
    parameters:
      - $ref: "./parameters.yaml#/orgParam"
      - $ref: "./parameters.yaml#/repoParam"
      - $ref: "./parameters.yaml#/pathParam"
    requestBody:
      content:
        multipart/form-data:
          schema:
            $ref: './schemas.yaml#/source'
          examples:
            multipart:
              $ref: "./payloads.yaml#/copySourceForm"
        text/html:
          schema:
            type: string
            description: Raw HTML content.
        application/json:
          schema:
            type: string
            description: Raw JSON content.
    responses:
      '201':
        $ref: "./responses.yaml#/201"
      '400':
        $ref: "./responses.yaml#/400"
      '401':
        $ref: "./responses.yaml#/401"
      '409':
        $ref: "./responses.yaml#/409"
      '413':
        description: The HTML or SVG content exceeds the size limit.
      '415':
        description: The content type does not match the file extension.
      '500':
        $ref: "./responses.yaml#/500"
  post:
    operationId: createSource
    tags:
      - Source
    summary: Create source content
    description: |
      Create a content **source** within an organization.

      Accepts either a `multipart/form-data` body with the content in the `data` field, or a
      raw request body for text-based types (`text/html`, `application/json`).

      The `multipart/form-data` body may also include an optional `guid` field. When the target
      location does not already have a stored identifier, `guid` becomes the document identifier.
      It must be a UUID. A `guid` that is not a UUID is rejected with a 400 response. When the
      target already has a stored identifier that differs from `guid`, the request is rejected with
      a 409 response. When omitted, the service generates a UUID.

      HTML (`.html` or `text/html`) and SVG (`.svg` or `image/svg+xml`) content is sanitised before it
      is stored. Markup outside the DA document format (scripts, event handlers, styles, unsafe URLs,
      unknown elements and attributes) is removed silently. HTML is normalised to the DA structure
      (`header`, `main` with section `div`s, `footer`, optional `da-metadata`), and content that is
      already clean is stored byte for byte. A file extension that does not match the content type
      is rejected with a 415 response; HTML over 10 MB or SVG over 5 MB is rejected with a 413 response.

      **Important:** For files, the `path` parameter must include the file extension (e.g., `myfile.html`, `data.json`).
      For folders, omit the extension (e.g., `myfolder`).
      Examples:
      - File: `/source/{org}/{repo}/myfile.html`
      - Folder: `/source/{org}/{repo}/myfolder`
    parameters:
      - $ref: "./parameters.yaml#/orgParam"
      - $ref: "./parameters.yaml#/repoParam"
      - $ref: "./parameters.yaml#/pathParam"
    requestBody:
      content:
        multipart/form-data:
          schema:
            $ref: './schemas.yaml#/source'
          examples:
            multipart:
              $ref: "./payloads.yaml#/copySourceForm"
        text/html:
          schema:
            type: string
            description: Raw HTML content.
        application/json:
          schema:
            type: string
            description: Raw JSON content.
    responses:
      '201':
        $ref: "./responses.yaml#/201"
      '400':
        $ref: "./responses.yaml#/400"
      '401':
        $ref: "./responses.yaml#/401"
      '409':
        $ref: "./responses.yaml#/409"
      '413':
        description: The HTML or SVG content exceeds the size limit.
      '415':
        description: The content type does not match the file extension.
      '500':
        $ref: "./responses.yaml#/500"
  delete:
    operationId: sourceDelete
    tags:
      - Source
    summary: Delete source content
    description: |
      Delete the content **source** or **directory**.
      
      **Important:** The `path` parameter works as follows:
      - For files: Include the extension in the path (e.g., `myfile.html`)
      - For folders: Omit the extension (e.g., `myfolder`)
      Examples:
      - Delete file: `/source/{org}/{repo}/myfile.html`
      - Delete folder: `/source/{org}/{repo}/myfolder`
    parameters:
      - $ref: "./parameters.yaml#/orgParam"
      - $ref: "./parameters.yaml#/repoParam"
      - $ref: "./parameters.yaml#/pathParam"
    responses:
      '204':
        $ref: "./responses.yaml#/204"
      '400':
        $ref: "./responses.yaml#/400"
      '401':
        $ref: "./responses.yaml#/401"
      '500':
        $ref: "./responses.yaml#/500"